<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26231f"/>
      <stop offset="100%" stop-color="#151412"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84accc" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5a86a8" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#c99d80" stroke-opacity="0.35" stroke-width="8"/>
  <!-- Incoming white ray -->
  <line x1="68" y1="278" x2="212" y2="250" stroke="#f5efe6" stroke-width="14" stroke-linecap="round"/>
  <!-- Spectral dispersed rays -->
  <line x1="292" y1="242" x2="444" y2="212" stroke="#ff3b30" stroke-width="10" stroke-linecap="round"/>
  <line x1="294" y1="252" x2="446" y2="246" stroke="#ff9500" stroke-width="10" stroke-linecap="round"/>
  <line x1="295" y1="262" x2="446" y2="280" stroke="#34c759" stroke-width="10" stroke-linecap="round"/>
  <line x1="294" y1="272" x2="442" y2="314" stroke="#388bfd" stroke-width="10" stroke-linecap="round"/>
  <line x1="292" y1="282" x2="436" y2="348" stroke="#af52de" stroke-width="10" stroke-linecap="round"/>
  <!-- Optical prism -->
  <polygon points="256,112 368,356 144,356" fill="url(#prism)" stroke="#c99d80" stroke-width="12" stroke-linejoin="round"/>
  <!-- Subtle internal beam -->
  <line x1="208" y1="252" x2="294" y2="262" stroke="#f5efe6" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
</svg>
